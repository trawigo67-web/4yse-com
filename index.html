<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>4YSE – Yakında · Demnächst · Coming soon</title>
<meta name="description" content="Yazılışı 4YSE, okunuşu Ayşe. Sayfa yapım aşamasında.">
<meta name="theme-color" content="#1B0A17">
<meta property="og:title" content="4YSE – Yakında">
<meta property="og:description" content="Yazılışı 4YSE, okunuşu Ayşe.">
<style>
@font-face{font-family:Anton;font-weight:400;font-display:swap;src:url(anton-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Anton;font-weight:400;font-display:swap;src:url(anton-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Inter;font-weight:500;font-display:swap;src:url(inter-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Inter;font-weight:500;font-display:swap;src:url(inter-latin-ext-500-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{--bg:#1B0A17;--accent:#FF6F9C;--fg:#FFFFFF;--muted:#D2BFCB}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;font-weight:500}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center}
.stripe{position:fixed;left:0;right:0;height:10px;background:repeating-linear-gradient(-45deg,var(--accent) 0 18px,var(--bg) 18px 36px)}
.stripe.top{top:0}.stripe.bottom{bottom:0}
.soon{font-family:Anton,Impact,sans-serif;letter-spacing:6px;font-size:clamp(16px,3.2vw,24px);color:var(--accent);margin:0 0 8px}
.logo{font-family:Anton,Impact,sans-serif;font-size:clamp(110px,30vw,260px);line-height:1;letter-spacing:4px;margin:0;display:flex;justify-content:center}
.logo .five{color:var(--accent)}
.bar{width:min(420px,70vw);height:6px;border-radius:3px;background:var(--accent);margin:22px auto 24px}
.slogan{font-family:Anton,Impact,sans-serif;font-size:clamp(26px,6vw,48px);line-height:1.08;letter-spacing:1px;margin:0}
.slogan span{color:var(--accent)}
.status{margin:22px 0 34px;font-size:clamp(12px,2.6vw,15px);letter-spacing:4px;color:var(--muted);line-height:2}
.status b{color:var(--fg);font-weight:500}
.langs{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.langs button{min-width:76px;min-height:48px;padding:0 22px;border:2px solid var(--accent);border-radius:14px;background:transparent;color:var(--fg);font-family:Anton,Impact,sans-serif;font-size:22px;letter-spacing:2px;cursor:pointer;transition:transform .15s}
.langs button:hover,.langs button:focus-visible{transform:scale(1.05)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.sub{margin-top:12px;font-size:13px;letter-spacing:3px;color:var(--muted)}
footer{margin-top:44px;font-size:12px;letter-spacing:3px;color:#B79FAF}
footer a{color:#B79FAF;text-decoration:none}
footer a:hover{color:var(--accent)}
.member{position:fixed;top:20px;right:20px;z-index:10;font-family:Inter,system-ui,sans-serif;font-weight:500;font-size:14px;letter-spacing:1px;color:var(--fg);text-decoration:none;border:1.5px solid var(--accent);border-radius:999px;padding:8px 16px;background:var(--bg)}
.member:hover,.member:focus-visible{background:var(--accent);color:var(--bg)}
</style>
</head>
<body>
<a class="member" href="https://4yse-ekip.pages.dev">Üye girişi</a>
<div class="stripe top"></div>

<p class="soon" id="soon">YAKINDA</p>
<h1 class="logo" aria-label="4YSE"><span class="five">4</span><span>YSE</span></h1>
<div class="bar"></div>
<p class="slogan"><span id="s1" style="color:inherit">YAZILIŞI 4YSE,</span><br><span id="s2" style="color:inherit">OKUNUŞU</span> <span>AYŞE.</span></p>

<p class="status">
  <b>4YSE.com</b><br>
  <span id="status">YAPIM AŞAMASINDA</span>
</p>

<div class="langs" role="group" aria-label="Dil · Sprache · Language">
  <button type="button" data-lang="tr" aria-pressed="true">TR</button>
  <button type="button" data-lang="de" aria-pressed="false">DE</button>
  <button type="button" data-lang="en" aria-pressed="false">EN</button>
</div>
<div class="sub">TÜRKÇE · DEUTSCH · ENGLISH</div>

<footer>4YSE · <a href="https://mu5a.com">MU5A</a> · <a href="https://xenosmart.de/impressum.html">Impressum</a></footer>

<div class="stripe bottom"></div>
<script>
(function(){
var T={
tr:{soon:'YAKINDA',s1:'YAZILIŞI 4YSE,',s2:'OKUNUŞU',status:'YAPIM AŞAMASINDA'},
de:{soon:'DEMNÄCHST',s1:'GESCHRIEBEN 4YSE,',s2:'GESPROCHEN',status:'SEITE IM AUFBAU'},
en:{soon:'COMING SOON',s1:'WRITTEN 4YSE,',s2:'PRONOUNCED',status:'UNDER CONSTRUCTION'}
};
var btns=document.querySelectorAll('.langs button');
function set(l){
var t=T[l];if(!t)return;
document.documentElement.lang=l;
['soon','s1','s2','status'].forEach(function(k){document.getElementById(k).textContent=t[k];});
btns.forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-lang')===l?'true':'false');});
}
btns.forEach(function(b){b.addEventListener('click',function(){set(b.getAttribute('data-lang'));});});
})();
</script>
</body>
</html>
